            application_id_mismatch, invalid_step, no_previous_step, step_navigation_not_allowed,
            step_not_actionable, step_not_started, unsupported_step_status, workflow_already_completed,
            workflow_entity_type_mismatch, workflow_not_found, plus request_invalid
            and internal_server_error, which both services spell alike. Not exhaustive
            and not an enum — that service owns this vocabulary and can extend it
            without a change here.'
        reason:
          type: string
          description: Human-readable summary, as set by the workflow service.
