      - name: document_id
        description: Document UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Document file attached
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/document_file"
        '422':
          description: Returns validation error
          x-errors:
          - code: record_invalid
            category: base
            message: The file broke a rule. A file that isn't a JPEG, PNG or
              PDF, or a document that already has 3 files, returns a readable
              message as the error_code on image.
            params: ''
          - code: missing
            category: file
            message: file wasn't sent. Send it base64-encoded.
            params: ''
          - code: duplicate_side
            category: side
            message: That side of a two-sided document already has a file.
            params: ''
          - code: detect_blur
            category: image
            message: Returned as request_invalid. A photo ID image failed the
              quality check. Take a new, clear photo of the whole document. The
              check runs only on proof_of_identity documents.
            params: ''
          - code: detect_cutoff
            category: image
            message: Returned as request_invalid. A photo ID image failed the
              quality check. Take a new, clear photo of the whole document. The
              check runs only on proof_of_identity documents.
            params: ''
          - code: document_detection
            category: image
            message: Returned as request_invalid. A photo ID image failed the
              quality check. Take a new, clear photo of the whole document. The
              check runs only on proof_of_identity documents.
            params: ''
          - code: validation
            category: form
            message: Returned as request_invalid. The application has already
              been submitted, so it can't be changed.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '413':
          description: File payload too large
          x-errors:
          - code: payload_too_large
            category: file
            message: The file is over 10MB once decoded.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/payload_too_large_response_v2"
        '404':
          description: Application or document not found
          x-errors:
          - code: record_not_found
            category: base
            message: The application or document doesn't exist, or the
              application wasn't created with your account.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/create_document_file_request"
