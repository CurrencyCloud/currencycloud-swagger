            message: last_name has no letters at all.
            params: ''
          - code: invalid_characters
            category: last_name
            message: last_name has a character we don't accept, such as a line
              break.
            params: ''
          - code: too_long
            category: last_name
            message: last_name is over 100 characters.
            params: ''
          - code: validation
            category: request_body_json
            message: Returned as request_invalid. A name field has characters we
              don't accept, and reason names the field. We accept A to Z,
              accented Latin-1 letters, apostrophes, hyphens, periods and single
              spaces.
            params: ''
          - code: either_building_number_or_name
            category: personal_address
            message: personal_address has neither a building_number nor a
              building_name.
            params: ''
          - code: required_for_country
            category: personal_address.state_or_province
            message: US and Canadian addresses need a state_or_province.
            params: ''
          - code: inclusion
            category: personal_address.state_or_province
            message: The state or province isn't a valid one for the country.
              Send its two-letter uppercase code, such as NY or ON.
            params: ''
          - code: not_found
            category: document_ids
            message: A listed document isn't on this application, or is already
              attached to someone or something else.
            params: ''
          - code: missing_sides
            category: document_ids
            message: A listed two-sided document is missing its front or back.
            params: ''
          - code: limit_exceeded
            category: document_ids
            message: More than 20 documents were listed.
            params: ''
          - code: validation
            category: form
            message: Returned as request_invalid. The application has already
              been submitted, so it can't be changed.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
              examples:
                field_rejected:
                  value:
                    status: failed
                    error_code: record_invalid
                    reason: Record invalid
                    error_messages:
                      email:
                      - error_code: invalid
                        reason: Email is invalid
                  summary: A field was rejected
                duplicate_person:
                  value:
                    status: failed
                    error_code: record_invalid
                    reason: Record invalid
                    error_messages:
                      person:
                      - error_code: duplicate_person
                        reason: 'A person with the same name and roles already exists
                          on this application (id: 3f1c2b9e-5d4a-4e7b-9c1a-2b6d8e0f4a71)'
                  summary: The new name and roles match a person already on this
                    application
        '404':
          description: Application or person not found
          x-errors:
          - code: record_not_found
            category: base
            message: The application or person doesn't exist, or the application
              wasn't created with your account.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/create_person_request_v2"
