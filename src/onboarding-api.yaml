  "/v2/identity_verifications":
    post:
      summary: Create Identity Verification
      description: Starts identity verification for a person on a submitted
        application, and returns the whitelabel_url of the hosted page to send
        them to. On a corporate application, only a person with the director
        role can be verified. Calling it again for the same person returns the
        same verification.
      tags:
      - Identity Verification
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters: []
      responses:
        '200':
          description: Applicant created successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/identity_verification_response"
        '422':
          description: Request could not be processed
          x-errors:
          - code: record_invalid
            category: base
            message: The body is invalid. error_messages names the field.
            params: ''
          - code: missing
            category: application_id
            message: application_id wasn't sent.
            params: ''
          - code: missing
            category: person_id
            message: person_id wasn't sent.
            params: ''
          - code: invalid
            category: application_id
            message: application_id isn't a UUID.
            params: ''
          - code: invalid
            category: person_id
            message: person_id isn't a UUID.
            params: ''
          - code: validation
            category: form
            message: Returned as request_invalid. The application isn't
              submitted yet.
            params: ''
          - code: validation
            category: person_id
            message: Returned as request_invalid. On a corporate application,
              only a person with the director role can be verified.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '400':
          description: Verification could not be started
          x-errors:
          - code: bad_request
            category: identity_verification
            message: The verification couldn't be started. Retry, and contact
              support with the application_id and person_id if it keeps failing.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '404':
          description: Application or person not found
          x-errors:
          - code: record_not_found
            category: base
            message: The application or person doesn't exist, or the application
              wasn't created with your account.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/create_identity_verification_request"
security:
- AuthToken: []
servers:
- url: /onboarding
  description: Relative URL
- url: https://api.currencycloud.com/onboarding
  description: Production server (uses live data)
- url: https://devapi.currencycloud.com/onboarding
  description: Demo server (uses test data)
components:
  securitySchemes:
    AuthToken:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: The authentication token returned by the Login endpoint.
  schemas:
    create_application_request:
      type: object
      properties:
        entity_type:
          type: string
          enum:
          - individual
          - corporate
          description: 'Type of applicant - individual or corporate. Set here only:
            the update endpoint does not accept it.'
        email:
          type: string
          maxLength: 255
          description: 'The applicant''s email address. Set here only: the update
            endpoint does not accept it.'
        agreed_to_terms_and_conditions:
          type: boolean
          description: 'Agreed to the terms and conditions. Must be true. Consent
            is gated here rather than at update, so no data is captured before it
            is given. Set here only: the update endpoint does not accept it.'
        business_role:
          type: string
          enum:
          - director_controller
          - sole_trader_business_role
          - authorised_person
          -
          description: 'Business role of the applicant — who is filing the application.
            Required for a corporate application and rejected on an individual one.
            Set here only: the update endpoint does not accept it. director_controller:
            a director is filling in the application. authorised_person: someone who
            isn''t a director is. sole_trader_business_role: a sole trader is applying,
            and the business information''s legal_entity_type must then be sole_trader.'
      required:
      - entity_type
      - email
      - agreed_to_terms_and_conditions
    create_person_request_v2:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
            enum:
            - director
            - ultimate_business_owner
            - user
          description: >-
            The person's role(s). On an individual application, user is the only role. A sole
            trader holds all three.
        document_ids:
          type: array
          items:
            type: string
          nullable: true
          description: 'List of IDs for any uploaded supporting documents. These types
            carry data on the reverse and need both a front and a back image uploaded
            before they can be listed here: biometric_state_id, driving_licence, residence_id,
            state_id.'
        first_name:
          type: string
          maxLength: 100
          description: First name. Cannot be a single initial. Up to 100 characters,
            using only the letters A to Z, accented letters from Western European
            languages such as é, ñ or ü, apostrophes, hyphens, periods, and single
            spaces between words.
        middle_name:
          type: string
          maxLength: 255
          nullable: true
          description: Middle name
        last_name:
          type: string
          maxLength: 100
          description: >-
            Surname. Cannot be a single initial, or end with a company signifier. Up to 100
            characters, using only the letters A to Z, accented letters from Western European
            languages such as é, ñ or ü, apostrophes, hyphens, periods, and single spaces between
            words.
        dob:
          type: string
          format: date
          nullable: true
          description: >-
            Date of Birth. Must give an age between 18 and 100 years. Needed for every person
            with the user role before the people step completes.
        phone_number:
          type: string
          maxLength: 255
          nullable: true
          description: Phone number, in E.164 format, such as +447700900123. A +44
            or +1 number has 10 digits after the country code. Required when roles
            includes user.
        email:
          type: string
          maxLength: 255
          nullable: true
          description: 'Email address. Ignored on an individual or sole trader application,
            where the one person is the applicant: their email is always the application''s,
            so neither create nor update can set it.'
        ownership_percentage:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: Percentage of company owned. Required for an
            ultimate_business_owner, who must hold at least 25%. The combined
            holding of all ultimate business owners on an application cannot
            exceed 100%.
        id_number:
          type: string
          maxLength: 255
          nullable: true
          description: Social security number. Required when roles includes user
            and home_country is US.
        home_country:
          type: string
          description: >-
            Country of residence, as an ISO 3166-1 alpha-2 code. On an individual application
            this must match personal_address_attributes.country, and — for the applicant — the
            <a href="/api-reference/#update-application">country on the application</a>.
