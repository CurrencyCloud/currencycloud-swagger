---
openapi: 3.0.3
info:
  title: Onboarding API
  version: v2
  description: Name fields (first_name, middle_name, last_name, contact_name)
    accept Latin-1 letters, apostrophes, hyphens, periods and single spaces.
    Anything else is rejected with a 422 naming the properties that carried it.
    Address fields have no character rule.
tags:
- name: Applications
  description: 'Create, update, find and submit onboarding applications. Creating
    an application also creates its workflow: the fixed sequence of steps you send
    its data in.'
- name: Steps
  description: "Move an application through its workflow: complete the step you're
    on, check where the workflow is, and go back to a step you've already completed."
- name: Account Usage
  description: Record how the applicant intends to use their account.
- name: Business Information
  description: Record the company's details on a corporate application.
- name: People
  description: 'Add and manage the people on an application: the applicant and, on
    a corporate application, its directors and ultimate business owners.'
- name: Documents
  description: Add the documents an application needs, then attach each one to
    the person, business information or account usage it's evidence for.
- name: Document Files
  description: Upload and manage the files that make up a document, such as the
    front and back of a driving licence.
- name: Identity Verification
  description: Start identity verification for a person on a submitted
    application.
paths:
  "/v2/applications":
    get:
      summary: Find Applications
      description: Returns a paginated list of the applications created by the
        authenticated account. Filter them by status or entity type, and sort
        them by creation or submission date.
      tags:
      - Applications
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: order
        in: query
        required: false
        description: 'Sort field. Accepts "created_at" or "submitted_at". Default:
          "created_at".'
        schema:
          type: string
      - name: order_asc_desc
        in: query
        required: false
        description: 'Sort direction. Accepts "asc" or "desc". Default: "asc".'
        schema:
          type: string
      - name: application_status
        in: query
        required: false
        description: Filter by application status.
        schema:
          type: string
      - name: entity_type
        in: query
        required: false
        description: Filter by entity type (individual or corporate).
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number.
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Number of results per page (1–50).
        schema:
          type: integer
      responses:
        '200':
          description: Returns list of applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/application_response"
                  pagination:
                    "$ref": "#/components/schemas/pagination"
        '400':
          description: Invalid query parameter
          x-errors:
          - code: request_invalid
            category: base
            message: A query parameter is missing or isn't one of its permitted
              values.
            params: ''
          - code: validation
            category: query
            message: The named query parameter, such as order or entity_type, is
              outside its permitted values.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
    post:
      summary: Create Application
      description: Creates an onboarding application and its workflow. The
        response returns the application_id and workflow_id you need for every
        later call, and the first step to complete. See <a
        href="/guides/onboarding/overview">the Onboarding guide</a> for the flow
        to follow.
      tags:
      - Applications
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters: []
      responses:
        '201':
          description: Application created successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/application_create_response"
        '502':
          description: Temporary failure on our side
          x-errors:
          - code: workflow_service_request_failed
            category: base
            message: The workflow service refused our call, but the application
              may have been saved. Look for it with GET /v2/applications before
              you create another one.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/bad_gateway_response_v2"
        '422':
          description: Invalid parameter in request params
          x-errors:
          - code: record_invalid
            category: base
            message: The data broke a rule. error_messages names each field with
              its own error_code. Besides the codes below, any field can return
              missing, invalid, inclusion, too_long or too_short.
            params: ''
          - code: missing
            category: agreed_to_terms_and_conditions
            message: agreed_to_terms_and_conditions wasn't sent.
            params: ''
          - code: accepted
            category: agreed_to_terms_and_conditions
            message: agreed_to_terms_and_conditions was false. Get the
              applicant's consent before you create the application, then send
              true.
            params: ''
          - code: present
            category: business_role
            message: business_role was sent on an individual application. It's
              for corporate applications only.
            params: ''
          - code: not_eligible_to_create_individual_accounts
            category: account_eligibility
            message: Returned as request_invalid. Your account can't create
              individual applications. Ask your Solutions Manager to enable it.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/create_application_request"
  "/v2/applications/{application_id}":
    get:
      summary: Get Application
      description: Gets an onboarding application, including its state.
      tags:
      - Applications
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Application found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/application_response"
        '404':
          description: Application not found
          x-errors:
          - code: record_not_found
            category: base
            message: The application doesn't exist, or the application wasn't
              created with your account.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
    put:
      summary: Update Application
      description: Updates an onboarding application. PUT replaces the
        application, so send the full body every time you update it.
      tags:
      - Applications
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Updates application when correct params are provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/application_response"
        '422':
          description: Returns validation error
          x-errors:
          - code: record_invalid
            category: base
            message: The data broke a rule. error_messages names each field with
              its own error_code. Besides the codes below, any field can return
              missing, invalid, inclusion, too_long or too_short.
            params: ''
          - code: cannot_be_cleared
            category: country
            message: null or an empty string was sent for country, phone_number,
              contact_name, agreed_to_marketing_emails or
              agreed_to_corporate_authority when it already has a value. Leave
              the field out to keep it.
            params: ''
          - code: jurisdiction_not_permitted
            category: country
            message: We can't onboard applications from this country. Check
              permitted_jurisdiction in GET /v1/countries.
            params: ''
          - code: country_mismatch
            category: country
            message: Individual applications only. The country doesn't match the
              applicant's home_country.
            params: ''
          - code: missing
            category: phone_number
            message: Corporate applications only. The application has no phone
              number yet.
            params: ''
          - code: invalid
            category: phone_number
            message: The number isn't in E.164 format, or its country code isn't
              recognized.
            params: ''
          - code: wrong_length
            category: phone_number
            message: A +1 or +44 number doesn't have 10 digits after the country
              code.
            params: ''
          - code: present
            category: agreed_to_corporate_authority
            message: agreed_to_corporate_authority was sent as true on an
              individual application.
            params: ''
          - code: too_short
            category: contact_name
            message: contact_name is under 2 characters.
            params: ''
          - code: initial
            category: contact_name
            message: contact_name is a single initial.
            params: ''
          - code: no_letters
            category: contact_name
            message: contact_name has no letters at all.
            params: ''
          - code: invalid_characters
            category: contact_name
            message: contact_name has a character we don't accept, such as a
              line break.
            params: ''
          - code: too_long
            category: contact_name
            message: contact_name is over 100 characters.
            params: ''
          - code: validation
            category: request_body_json
            message: Returned as request_invalid. A name field has characters we
              don't accept, and reason names the field. We accept A to Z,
              accented Latin-1 letters, apostrophes, hyphens, periods and single
              spaces.
            params: ''
          - code: validation
            category: form
            message: Returned as request_invalid. The application has already
              been submitted, so it can't be changed.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '404':
          description: Application not found
          x-errors:
          - code: record_not_found
            category: base
            message: The application doesn't exist, or the application wasn't
              created with your account.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/update_application_request"
    delete:
      summary: Delete Application
      description: Deletes an onboarding application.
      tags:
      - Applications
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Application deleted successfully
        '404':
          description: Application not found
          x-errors:
          - code: record_not_found
            category: base
            message: The application doesn't exist, or the application wasn't
              created with your account.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '422':
          description: Application is immutable
          x-errors:
          - code: request_invalid
            category: base
            message: The request failed a check. error_messages names the field.
            params: ''
          - code: validation
            category: form
            message: Returned as request_invalid. The application has already
              been submitted, so it can't be changed.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
  "/v2/applications/{application_id}/submit":
    post:
      summary: Submit Application
      description: 'Submits the onboarding application for review. Every workflow
        step before form_submit (form_submit_corp for a corporate) must be completed
        first. Submitting is final: the application is locked once it has been submitted.'
      tags:
      - Applications
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/application_response"
        '422':
          description: Already submitted, or steps not complete
          x-errors:
          - code: record_invalid
            category: base
            message: Submit checks the whole application again, so any field
              code from the earlier steps can also come back here. You get one
              part's errors per response.
            params: ''
          - code: validation
            category: workflow
            message: Returned as request_invalid. Earlier workflow steps aren't
              complete yet.
            params: ''
          - code: already_submitted
            category: base
            message: The application has already been submitted.
            params: ''
          - code: missing
            category: people
            message: The application has no people.
            params: ''
          - code: missing_user_role
            category: people
            message: No one on the application has the user role.
            params: ''
          - code: missing_director_role
            category: people
            message: Corporate applications only. No one has the director role.
            params: ''
          - code: missing_initial_capital
            category: form
            message: Corporate applications only. A company incorporated in the
              last 12 months needs initial_capital.
            params: ''
          - code: jurisdiction_not_permitted
            category: country
            message: The application's country isn't one we can onboard from.
            params: ''
          - code: jurisdiction_not_permitted
            category: personal_address
            message: Individual applications only. The applicant's address is in
              a country we can't onboard from.
            params: ''
          - code: jurisdiction_not_permitted
            category: registered_address
            message: Corporate applications only. The company's registered
              address is in a country we can't onboard from.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '404':
          description: Application not found
          x-errors:
          - code: record_not_found
            category: base
            message: The application doesn't exist, or the application wasn't
              created with your account.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
  "/v2/workflows/{workflow_id}/steps/{step_id}/completion":
    put:
      summary: Complete Step
      description: Completes the step the workflow is on, and returns the next
        step. steps is empty once the workflow is finished. See <a
        href="/guides/onboarding/workflows">Workflows</a> for the steps in each
        flow.
      tags:
      - Steps
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: workflow_id
        in: path
        schema:
          type: string
          format: uuid
        description: The workflow identifier.
        required: true
      - name: step_id
        in: path
        schema:
          type: string
        description: The step identifier.
        required: true
      - name: application_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: The application that owns the workflow. Must belong to the
          caller.
      responses:
        '200':
          description: Step completed successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/step_completion_response"
        '404':
          description: Workflow or step not found
          x-errors:
          - code: workflow_not_found
            category: base
            message: The workflow doesn't exist.
            params: ''
          - code: application_id_mismatch
            category: base
            message: The workflow doesn't belong to this application_id. Pair
              the workflow_id with the application_id it was created with.
            params: ''
          - code: invalid_step
            category: base
            message: The step ID isn't in this application's workflow, for
              example a corporate step on an individual application.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/eco_relayed_error_response_v2"
        '422':
          description: Invalid request
          x-errors:
          - code: request_invalid
            category: base
            message: The step can't complete yet. error_messages names what's
              missing, with validation as its error_code.
            params: ''
          - code: validation
            category: field
            message: The named field is missing or isn't valid yet, such as
              country on basic_info. Each step in your flow guide says what it
              needs.
            params: ''
          - code: validation
            category: state
            message: form_submit or form_submit_corp was completed before the
              application was submitted.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '409':
          description: Step transition rejected
          x-errors:
          - code: step_not_started
            category: base
            message: The step isn't the current one. Call GET
              /v2/workflows/{workflow_id}/steps/current and complete the step it
              returns.
            params: ''
          - code: step_not_actionable
            category: base
            message: id_verification can't be completed directly. It completes
              on its own when you complete form_submit or form_submit_corp.
            params: ''
          - code: workflow_already_completed
            category: base
            message: The workflow is finished. This is the normal end of the
              journey.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/eco_relayed_error_response_v2"
        '400':
          description: Rejected by the workflow
          x-errors:
          - code: unsupported_step_status
            category: base
            message: The status sent isn't one this endpoint accepts. Send
              completed.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/eco_relayed_error_response_v2"
        '500':
          description: Internal server error
          x-errors:
          - code: internal_server_error
            category: base
            message: Something went wrong on our side, or the workflow couldn't
              be reached. Check whether the call landed before you retry.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/internal_server_error_response_v2"
        '502':
          description: Temporary failure on our side
          x-errors:
          - code: workflow_service_request_failed
            category: base
            message: The workflow service refused our call. There's nothing to
              fix in your request. Retry, and contact support if it keeps
              happening.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/bad_gateway_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/step_completion_request"
  "/v2/workflows/{workflow_id}/steps/current":
    get:
      summary: Get Current Steps
      description: Returns the IDs of the steps the workflow is on.
      tags:
      - Steps
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: workflow_id
        in: path
        schema:
          type: string
          format: uuid
        description: The workflow identifier.
        required: true
      - name: application_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: The application that owns the workflow. Must belong to the
          caller.
      responses:
        '200':
          description: Current steps retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/current_steps_response"
        '404':
          description: Workflow not found
          x-errors:
          - code: workflow_not_found
            category: base
            message: The workflow doesn't exist.
            params: ''
          - code: application_id_mismatch
            category: base
            message: The workflow doesn't belong to this application_id. Pair
              the workflow_id with the application_id it was created with.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/eco_relayed_error_response_v2"
        '502':
          description: Temporary failure on our side
          x-errors:
          - code: workflow_service_request_failed
            category: base
            message: The workflow service refused our call. There's nothing to
              fix in your request. Retry, and contact support if it keeps
              happening.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/bad_gateway_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
    put:
      summary: Navigate To Step
      description: Moves the workflow to a step you've completed, or to any step
        before the one it's on, so you can correct its data and complete it
        again.
      tags:
      - Steps
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: workflow_id
        in: path
        schema:
          type: string
          format: uuid
        description: The workflow identifier.
        required: true
      - name: application_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: The application that owns the workflow. Must belong to the
          caller.
      responses:
        '200':
          description: Current step set successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/step_current_response"
        '404':
          description: Workflow or step not found
          x-errors:
          - code: workflow_not_found
            category: base
            message: The workflow doesn't exist.
            params: ''
          - code: application_id_mismatch
            category: base
            message: The workflow doesn't belong to this application_id. Pair
              the workflow_id with the application_id it was created with.
            params: ''
          - code: invalid_step
            category: base
            message: The step ID isn't in this application's workflow, for
              example a corporate step on an individual application.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/eco_relayed_error_response_v2"
        '409':
          description: Step not actionable
          x-errors:
          - code: step_navigation_not_allowed
            category: base
            message: The step hasn't been started and comes after the one the
              workflow is on. You can move to any step before the current one,
              or to a step that's already completed.
            params: ''
          - code: step_not_actionable
            category: base
            message: id_verification can't be navigated to.
            params: ''
          - code: workflow_already_completed
            category: base
            message: The workflow is finished, so there's no step to move to.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/eco_relayed_error_response_v2"
        '502':
          description: Temporary failure on our side
          x-errors:
          - code: workflow_service_request_failed
            category: base
            message: The workflow service refused our call. There's nothing to
              fix in your request. Retry, and contact support if it keeps
              happening.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/bad_gateway_response_v2"
        '422':
          description: Invalid request
          x-errors:
          - code: record_invalid
            category: base
            message: The body is invalid. error_messages names the field.
            params: ''
          - code: missing
            category: step_id
            message: step_id wasn't sent.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/step_current_request"
  "/v2/workflows/{workflow_id}/steps/previous":
    get:
      summary: Get Previous Step
      description: Returns the step before the one the workflow is on, whatever
        its status, or an empty list on the first step.
      tags:
      - Steps
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: workflow_id
        in: path
        schema:
          type: string
          format: uuid
        description: The workflow identifier.
        required: true
      - name: application_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: The application that owns the workflow. Must belong to the
          caller.
      responses:
        '200':
          description: Previous step retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/previous_step_response"
        '404':
          description: Workflow not found
          x-errors:
          - code: workflow_not_found
            category: base
            message: The workflow doesn't exist.
            params: ''
          - code: application_id_mismatch
            category: base
            message: The workflow doesn't belong to this application_id. Pair
              the workflow_id with the application_id it was created with.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/eco_relayed_error_response_v2"
        '502':
          description: Temporary failure on our side
          x-errors:
          - code: workflow_service_request_failed
            category: base
            message: The workflow service refused our call. There's nothing to
              fix in your request. Retry, and contact support if it keeps
              happening.
            params: ''
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/bad_gateway_response_v2"
        '401':
