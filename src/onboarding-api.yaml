    validation_error_response_v2:
      type: object
      description: A field-level rejection. Returned as 422 for a body that
        parsed but failed validation, and as 400 where the request could not be
        read at all. A write that collided with an existing record is also a
        422, keyed on `record` with `not_unique` rather than on a field, because
        a uniqueness failure names a database index rather than anything the
        caller sent.
      properties:
        status:
          type: string
          enum:
          - error
          - failed
          description: "`failed` when the caller can correct the request, `error`
            when they cannot."
        error_code:
          type: string
          enum:
          - bad_request
          - forbidden
          - impersonation_check_failed
          - internal_server_error
          - payload_too_large
          - record_invalid
          - record_not_found
          - request_invalid
          - too_many_requests
          - unauthorized
          description: Machine-readable classification of the failure.
        reason:
          type: string
          description: Human-readable summary of the failure.
        error_messages:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                error_code:
                  type: string
                  description: 'What is wrong with this field. `missing` when it was
                    not supplied, for a field whose presence rule is version-aware;
                    `blank` is the v1 equivalent, and also what v2 gets from a field
                    not yet converted off plain `presence: true`. `invalid` when the
                    value was rejected by a type or format rule, `inclusion` when
                    it is outside the permitted set, `too_long` or `too_short` when
                    it breaches a length or size limit, `greater_than_or_equal_to`
                    or `less_than_or_equal_to` when it breaches a numeric bound, `taken`
                    when it collides with an existing record, and `unknown` when the
                    field is not part of the request at all. `accepted` appears where
                    a consent was supplied but refused, which is distinct from never
                    having been supplied. `not_unique` appears where a database uniqueness
                    constraint rejected the write rather than a validation. `validation`
                    and `bad_request` appear where the request could not be read at
                    all. Rule-specific codes such as `person_limit_exceeded` or `ubo_total_exceeded`
                    name a business rule the value broke. Treat this as an open set:
                    new rules add codes, and errors on a document image still carry
                    a sentence rather than a code.'
                reason:
                  type: string
                  description: What the caller needs to change.
              required:
              - error_code
              - reason
          description: Errors keyed by the field they apply to, or by the
            condition or resource at fault where no single field is responsible.
      required:
      - status
      - error_code
      - reason
      - error_messages
      example:
        status: failed
        error_code: record_invalid
        reason: Record invalid
        error_messages:
          entity_type:
          - error_code: missing
            reason: Entity type is required
          personal_address.country:
          - error_code: inclusion
            reason: Personal address country is not one of the permitted values
    not_found_response_v2:
      type: object
      description: The addressed resource does not exist, or the caller is not
        entitled to see it.
      properties:
        status:
          type: string
          enum:
          - error
          - failed
          description: "`failed` when the caller can correct the request, `error`
            when they cannot."
        error_code:
          type: string
          enum:
          - bad_request
          - forbidden
          - impersonation_check_failed
          - internal_server_error
          - payload_too_large
          - record_invalid
          - record_not_found
          - request_invalid
          - too_many_requests
          - unauthorized
          description: Machine-readable classification of the failure.
        reason:
          type: string
          description: Human-readable summary of the failure.
        error_messages:
          type: object
          nullable: true
          description: 'Always null: no failure is attributable to a field.'
      required:
      - status
      - error_code
      - reason
      - error_messages
      example:
        status: failed
        error_code: record_not_found
        reason: Record not found
        error_messages:
