---
openapi: 3.0.3
info:
  title: Onboarding API
  version: v2
  description: Name fields (first_name, middle_name, last_name, contact_name)
    accept Latin-1 letters, apostrophes, hyphens, periods and single spaces.
    Anything else is rejected with a 422 naming the properties that carried it.
    Address fields have no character rule.
tags:
- name: Applications
  description: 'Create, update, find and submit onboarding applications. Creating
    an application also creates its workflow: the fixed sequence of steps you send
    its data in.'
- name: Steps
  description: "Move an application through its workflow: complete the step you're
    on, check where the workflow is, and go back to a step you've already completed."
- name: Account Usage
  description: Record how the applicant intends to use their account.
- name: Business Information
  description: Record the company's details on a corporate application.
- name: People
  description: 'Add and manage the people on an application: the applicant and, on
    a corporate application, its directors and ultimate business owners.'
- name: Documents
  description: Add the documents an application needs, then attach each one to
    the person, business information or account usage it's evidence for.
- name: Document Files
  description: Upload and manage the files that make up a document, such as the
    front and back of a driving licence.
- name: Identity Verification
  description: Start identity verification for a person on a submitted
    application.
paths:
  "/v2/applications":
    get:
      summary: Find Applications
      description: Returns a paginated list of the applications created by the
        authenticated account. Filter them by status or entity type, and sort
        them by creation or submission date.
      tags:
      - Applications
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: order
        in: query
        required: false
        description: 'Sort field. Accepts "created_at" or "submitted_at". Default:
          "created_at".'
        schema:
          type: string
      - name: order_asc_desc
        in: query
        required: false
        description: 'Sort direction. Accepts "asc" or "desc". Default: "asc".'
        schema:
          type: string
      - name: application_status
        in: query
        required: false
        description: Filter by application status.
        schema:
          type: string
      - name: entity_type
        in: query
        required: false
        description: Filter by entity type (individual or corporate).
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number.
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Number of results per page (1–50).
        schema:
          type: integer
      responses:
        '200':
          description: Returns list of applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/application_response"
                  pagination:
                    "$ref": "#/components/schemas/pagination"
        '400':
          description: Invalid query parameter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
    post:
      summary: Create Application
      description: Creates an onboarding application and its workflow. The
        response returns the application_id and workflow_id you need for every
        later call, and the first step to complete. See <a
        href="/guides/onboarding/overview">the Onboarding guide</a> for the flow
        to follow.
      tags:
      - Applications
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters: []
      responses:
        '201':
          description: Application created successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/application_create_response"
        '502':
          description: A temporary failure on our side, not a fault in the
            request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/bad_gateway_response_v2"
        '422':
          description: Invalid parameter in request params
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/create_application_request"
  "/v2/applications/{application_id}":
    get:
      summary: Get Application
      description: Gets an onboarding application, including its state.
      tags:
      - Applications
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Application found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/application_response"
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
    put:
      summary: Update Application
      description: Updates an onboarding application. PUT replaces the
        application, so send the full body every time you update it.
      tags:
      - Applications
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Updates application when correct params are provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/application_response"
        '422':
          description: Returns validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/update_application_request"
    delete:
      summary: Delete Application
      description: Deletes an onboarding application.
      tags:
      - Applications
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Application deleted successfully
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '422':
          description: Application is immutable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
  "/v2/applications/{application_id}/submit":
    post:
      summary: Submit Application
      description: 'Submits the onboarding application for review. Every workflow
        step before form_submit (form_submit_corp for a corporate) must be completed
        first. Submitting is final: the application is locked once it has been submitted.'
      tags:
      - Applications
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/application_response"
        '422':
          description: Application already submitted, or its workflow steps not
            completed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
  "/v2/workflows/{workflow_id}/steps/{step_id}/completion":
    put:
      summary: Complete Step
      description: Completes the step the workflow is on, and returns the next
        step. steps is empty once the workflow is finished. See <a
        href="/guides/onboarding/workflows">Workflows</a> for the steps in each
        flow.
      tags:
      - Steps
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: workflow_id
        in: path
        schema:
          type: string
          format: uuid
        description: The workflow identifier.
        required: true
      - name: step_id
        in: path
        schema:
          type: string
        description: The step identifier.
        required: true
      - name: application_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: The application that owns the workflow. Must belong to the
          caller.
      responses:
        '200':
          description: Step completed successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/step_completion_response"
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '409':
          description: Workflow step transition rejected by the onboarding
            workflow service (conflict)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/eco_relayed_error_response_v2"
        '400':
          description: The onboarding workflow service rejects the request as
            invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/eco_relayed_error_response_v2"
        '500':
          description: Internal error in the onboarding workflow service
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/internal_server_error_response_v2"
        '502':
          description: A temporary failure on our side, not a fault in the
            request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/bad_gateway_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/step_completion_request"
  "/v2/workflows/{workflow_id}/steps/current":
    get:
      summary: Get Current Steps
      description: Returns the IDs of the steps the workflow is on.
      tags:
      - Steps
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: workflow_id
        in: path
        schema:
          type: string
          format: uuid
        description: The workflow identifier.
        required: true
      - name: application_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: The application that owns the workflow. Must belong to the
          caller.
      responses:
        '200':
          description: Current steps retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/current_steps_response"
        '404':
          description: The onboarding workflow service could not find the
            workflow
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/eco_relayed_error_response_v2"
        '409':
          description: Workflow entity type mismatch
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/eco_relayed_error_response_v2"
        '502':
          description: A temporary failure on our side, not a fault in the
            request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/bad_gateway_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
    put:
      summary: Update Current Step
      description: Moves the workflow to a step you've completed, or to any step
        before the one it's on, so you can correct its data and complete it
        again.
      tags:
      - Steps
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: workflow_id
        in: path
        schema:
          type: string
          format: uuid
        description: The workflow identifier.
        required: true
      - name: application_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: The application that owns the workflow. Must belong to the
          caller.
      responses:
        '200':
          description: Current step set successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/step_current_response"
        '404':
          description: The onboarding workflow service could not find the
            workflow
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/eco_relayed_error_response_v2"
        '409':
          description: Step not actionable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/eco_relayed_error_response_v2"
        '502':
          description: A temporary failure on our side, not a fault in the
            request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/bad_gateway_response_v2"
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/step_current_request"
  "/v2/workflows/{workflow_id}/steps/previous":
    get:
      summary: Get Previous Step
      description: Returns the step before the one the workflow is on, whatever
        its status, or an empty list on the first step.
      tags:
      - Steps
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: workflow_id
        in: path
        schema:
          type: string
          format: uuid
        description: The workflow identifier.
        required: true
      - name: application_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: The application that owns the workflow. Must belong to the
          caller.
      responses:
        '200':
          description: Previous step retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/previous_step_response"
        '404':
          description: The onboarding workflow service could not find the
            workflow
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/eco_relayed_error_response_v2"
        '409':
          description: No previous step (at first step)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/eco_relayed_error_response_v2"
        '502':
          description: A temporary failure on our side, not a fault in the
            request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/bad_gateway_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
  "/v2/applications/{application_id}/account_usage":
    get:
      summary: Get Account Usage
      description: Gets an application's associated account usage. The account
        usage outlines how the applicant intends to use their account.
      tags:
      - Account Usage
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Account usage found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/account_usage_v2"
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
    put:
      summary: Update Account Usage
      description: Updates an application's associated account usage. The
        account usage outlines how the applicant intends to use their account.
        PUT replaces the account usage, so send the full body every time you
        update it.
      tags:
      - Account Usage
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Account usage updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/account_usage_v2"
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '422':
          description: Account usage params are invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/account_usage_request"
    delete:
      summary: Delete Account Usage
      description: Deletes the account usage for the specified application.
      tags:
      - Account Usage
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Account usage deleted successfully
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '422':
          description: Application is already submitted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
  "/v2/applications/{application_id}/business_information":
    get:
      summary: Get Business Information
      description: Gets the business information for the specified application.
        Business information is only relevant to corporate applications.
      tags:
      - Business Information
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Business information found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/business_information_v2"
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
    put:
      summary: Update Business Information
      description: Updates the business information for the specified
        application. Business information is only relevant to corporate
        applications. PUT replaces the business information, so send the full
        body every time you update it.
      tags:
      - Business Information
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Business information updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/business_information_v2"
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '422':
          description: Validation error on request body
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/business_information_request"
    delete:
      summary: Delete Business Information
      description: Deletes the business information for the specified
        application. Business information is only relevant to corporate
        applications.
      tags:
      - Business Information
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Business information deleted successfully
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '422':
          description: Application is already submitted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
  "/v2/applications/{application_id}/people":
    get:
      summary: Get People
      description: Returns all people associated with the specified application.
      tags:
      - People
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Retrieves all people for the application
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/person_v2"
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
    post:
      summary: Create Person
      description: Records a person's details on the specified application. Add
        each person once, with all of their roles.
      tags:
      - People
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Creates a person when correct params are provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/person_v2"
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '422':
          description: A field was rejected, or the person already exists on
            this application
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
              examples:
                field_rejected:
                  value:
                    status: failed
                    error_code: record_invalid
                    reason: Record invalid
                    error_messages:
                      email:
                      - error_code: invalid
                        reason: Email is invalid
                  summary: A field was rejected
                duplicate_person:
                  value:
                    status: failed
                    error_code: record_invalid
                    reason: Record invalid
                    error_messages:
                      person:
                      - error_code: duplicate_person
                        reason: 'A person with the same name and roles already exists
                          on this application (id: 3f1c2b9e-5d4a-4e7b-9c1a-2b6d8e0f4a71)'
                  summary: A person with the same name and roles is already on
                    this application
        '401':
          "$ref": "#/components/responses/unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/create_person_request_v2"
  "/v2/applications/{application_id}/people/{person_id}":
    get:
      summary: Get Person
      description: Returns the details of the person with the specified UUID on
        the application.
      tags:
      - People
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      - name: person_id
        description: Person UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns the person
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/person_v2"
        '404':
          description: Application or person not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
    delete:
      summary: Delete Person
      description: Deletes the details of the person with the specified UUID
        from the application.
      tags:
      - People
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      - name: person_id
        description: Person UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deletes the person
        '422':
          description: Application is already submitted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '404':
          description: Application or person not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
    put:
      summary: Update Person
      description: Updates a person's details on the specified application. PUT
        replaces the person, so send the full body every time you update it.
      tags:
      - People
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      - name: person_id
        description: Person UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Updates a person when correct params are provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/person_v2"
        '422':
          description: Invalid person parameters, application already submitted,
            or the person already exists
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
              examples:
                field_rejected:
                  value:
                    status: failed
                    error_code: record_invalid
                    reason: Record invalid
                    error_messages:
                      email:
                      - error_code: invalid
                        reason: Email is invalid
                  summary: A field was rejected
                duplicate_person:
                  value:
                    status: failed
                    error_code: record_invalid
                    reason: Record invalid
                    error_messages:
                      person:
                      - error_code: duplicate_person
                        reason: 'A person with the same name and roles already exists
                          on this application (id: 3f1c2b9e-5d4a-4e7b-9c1a-2b6d8e0f4a71)'
                  summary: The new name and roles match a person already on this
                    application
        '404':
          description: Application or person not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/create_person_request_v2"
  "/v2/applications/{application_id}/documents/{id}":
    get:
      summary: Get Document
      description: Returns the specified document on the application.
      tags:
      - Documents
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      - name: id
        description: Document UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns the document
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/document"
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
    delete:
      summary: Delete Document
      description: Deletes the document with the specified UUID from the
        application.
      tags:
      - Documents
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      - name: id
        description: Document UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deletes the document
        '422':
          description: Application has already been submitted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '404':
          description: Application or document not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
  "/v2/applications/{application_id}/documents":
    get:
      summary: Get Documents
      description: Returns the uploaded documents for the specified application.
      tags:
      - Documents
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Retrieves all application documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/document"
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
    post:
      summary: Create Document
      description: Adds a document to the specified application. Upload its
        files with Create Document File, then attach it to the person, business
        information or account usage it's evidence for by sending its ID in
        document_ids. See <a
        href="/guides/onboarding/corporate#documents">Onboard a business</a> for
        the documents a company needs.
      tags:
      - Documents
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Creates a document when correct params are provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/document"
        '422':
          description: Returns validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/create_document_request"
  "/v2/applications/{application_id}/documents/{document_id}/document_files":
    get:
      summary: Get Document Files
      description: Returns metadata (id, side, timestamps) for each file
        uploaded to the specified document on the application. The file content
        itself is not returned.
      tags:
      - Document Files
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      - name: document_id
        description: Document UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Retrieves all document files
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/document_file"
        '404':
          description: Application or document not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
    post:
      summary: Create Document File
      description: 'Uploads a file to the specified document on the application, as
        a base64 string without a data: prefix. A two-sided document needs both sides
        uploaded before you can attach it.'
      tags:
      - Document Files
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      - name: document_id
        description: Document UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Document file attached
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/document_file"
        '422':
          description: Returns validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '413':
          description: File payload too large
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/payload_too_large_response_v2"
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/create_document_file_request"
  "/v2/applications/{application_id}/documents/{document_id}/document_files/{id}":
    delete:
      summary: Delete Document File
      description: Deletes the document file with the specified UUID from a
        document on the application.
      tags:
      - Document Files
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters:
      - name: application_id
        description: Application UUID
        in: path
        required: true
        schema:
          type: string
      - name: document_id
        description: Document UUID
        in: path
        required: true
        schema:
          type: string
      - name: id
        description: Document file UUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deletes the document file
        '422':
          description: Application has already been submitted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '404':
          description: Application, document or document file not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
  "/v2/identity_verifications":
    post:
      summary: Create Identity Verification
      description: Starts identity verification for a person on a submitted
        application, and returns the whitelabel_url of the hosted page to send
        them to. On a corporate application, only a person with the director
        role can be verified. Calling it again for the same person returns the
        same verification.
      tags:
      - Identity Verification
      x-api-group: Onboard
      security:
      - AuthToken: []
      parameters: []
      responses:
        '200':
          description: Applicant created successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/identity_verification_response"
        '422':
          description: Request could not be processed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '400':
          description: Identity-verification applicant could not be created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response_v2"
        '404':
          description: Form not found, or person does not exist on the form
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/create_identity_verification_request"
security:
- AuthToken: []
servers:
- url: /onboarding
  description: Relative URL
- url: https://api.currencycloud.com/onboarding
  description: Production server (uses live data)
- url: https://devapi.currencycloud.com/onboarding
  description: Demo server (uses test data)
components:
  securitySchemes:
    AuthToken:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: The authentication token returned by the Login endpoint.
  schemas:
    create_application_request:
      type: object
      properties:
        entity_type:
          type: string
          enum:
          - individual
          - corporate
          description: Type of applicant - individual or corporate.
        brand_name:
          type: string
          maxLength: 255
          description: Brand the application is being made under. Resolved to
            the introducing account, so it determines the application's
            attribution. Required for web-sourced requests.
        brand_key:
          type: string
          maxLength: 255
          description: House account key identifier. Resolved together with
            brand_name, and needed whenever a brand has more than one house
            account — without it the lookup finds several and resolves none.
        email:
          type: string
          maxLength: 255
          description: 'The applicant''s email address. Set here only: the update
            endpoint does not accept it.'
        agreed_to_terms_and_conditions:
          type: boolean
          description: 'Agreed to the terms and conditions. Consent is gated here
            rather than at update, so no data is captured before it is given. Set
            here only: the update endpoint does not accept it.'
        business_role:
          type: string
          enum:
          - director_controller
          - sole_trader_business_role
          - authorised_person
          -
          description: 'Business role of the applicant — who is filing the application.
            Required for a corporate application and rejected on an individual one.
            Set here only: the update endpoint does not accept it.'
      required:
      - entity_type
      - email
      - agreed_to_terms_and_conditions
    create_person_request_v2:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
            enum:
            - director
            - ultimate_business_owner
            - user
          description: The person's role(s).
        document_ids:
          type: array
          items:
            type: string
          nullable: true
          description: 'List of IDs for any uploaded supporting documents. These types
            carry data on the reverse and need both a front and a back image uploaded
            before they can be listed here: biometric_state_id, driving_licence, residence_id,
            state_id.'
        first_name:
          type: string
          maxLength: 255
          description: First name. Cannot be a single initial.
        middle_name:
          type: string
          maxLength: 255
          nullable: true
          description: Middle name
        last_name:
          type: string
          maxLength: 255
          description: Surname. Cannot be a single initial, or end with a
            company signifier.
        dob:
          type: string
          format: date
          nullable: true
          description: Date of Birth. Must give an age between 18 and 100 years.
        phone_number:
          type: string
          maxLength: 255
          nullable: true
          description: Phone number. Required when roles includes user.
        email:
          type: string
          maxLength: 255
          nullable: true
          description: 'Email address. Ignored on an individual or sole trader application,
            where the one person is the applicant: their email is always the application''s,
            so neither create nor update can set it.'
        ownership_percentage:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: Percentage of company owned. Required for an
            ultimate_business_owner, who must hold at least 25%. The combined
            holding of all ultimate business owners on an application cannot
            exceed 100%.
        id_number:
          type: string
          maxLength: 255
          nullable: true
          description: Social security number. Required when roles includes user
            and home_country is US.
        home_country:
