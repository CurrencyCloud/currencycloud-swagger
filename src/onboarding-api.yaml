              schema:
                "$ref": "#/components/schemas/not_found_response_v2"
        '401':
          "$ref": "#/components/responses/unauthorized"
    post:
      summary: Create Document File
      description: 'Uploads a file to the specified document on the application, as
        a base64 string without a data: prefix. A two-sided document needs both sides
        uploaded before you can attach it.'
      tags:
      - Document Files
      x-api-group: Onboard
      security:
      - AuthToken: []
